<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfiniClick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <h1>InfiniClick</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="board">1</span>
          <span class="stat-label">Board</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="fragments">0</span>
          <span class="stat-label">Shards</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="fps">0</span>
          <span class="stat-label">Shards / s</span>
        </div>
      </div>
    </header>

    <main id="stage">
      <canvas id="game"></canvas>
      <div id="hint">Click the blocks to crack them — or let the balls do the work.</div>
    </main>

    <aside id="shop">
      <h2>Balls</h2>
      <div id="ballbar"></div>
      <h2>Upgrades</h2>
      <div id="upgrades"></div>
      <button id="reset" title="Wipes all progress">Reset</button>
    </aside>
  </div>

  <script src="game.js"></script>
</body>
</html>
