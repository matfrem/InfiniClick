<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfiniClick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <h1>InfiniClick</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="board">0%</span>
          <span class="stat-label" id="metaLabel">Quark era</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="fragments">0</span>
          <span class="stat-label">Shards</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="fps">0</span>
          <span class="stat-label">Shards / s</span>
        </div>
      </div>
    </header>

    <main id="stage">
      <canvas id="game"></canvas>
      <div id="hint">Click bricks to finish faster</div>
      <div id="intro" class="hidden">
        <div class="intro-card">
          <div class="intro-kicker">You are exploring a</div>
          <div class="intro-name">Quark</div>
          <div class="intro-body">the smallest speck there is. Shatter every brick to zoom out and discover what contains it.</div>
          <div class="intro-go">Tap to begin ✦</div>
        </div>
      </div>
    </main>

    <aside id="shop">
      <h2>Balls</h2>
      <div id="ballbar"></div>
      <h2>Shop</h2>
      <div id="upgrades"></div>
      <div class="shop-links">
        <a href="stats.html">Economy stats ↗</a>
        <button id="reset" title="Wipes all progress">Reset</button>
      </div>
    </aside>
  </div>

  <script src="config.js"></script>
  <script src="economy.js"></script>
  <script src="layout.js"></script>
  <script src="game.js"></script>
</body>
</html>
